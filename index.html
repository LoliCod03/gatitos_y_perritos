<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clasificador de Mascotas 🐾</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
      :root {
        --rosa-principal: #ff85a2;
        --rosa-oscuro: #f06292;
        --rosa-claro: #fce4ec;
      }
      body { background-color: var(--rosa-claro); font-family: 'Segoe UI', sans-serif; }
      .header {
        background: var(--rosa-principal);
        color: white;
        padding: 20px 0;
        border-bottom: 5px solid var(--rosa-oscuro);
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        margin-bottom: 20px;
      }
      #resultado {
        font-weight: bold;
        font-size: 3rem;
        text-align: center;
        min-height: 70px;
        margin-top: 15px;
        transition: all 0.3s;
      }
      .canvas-container { 
        margin: 0 auto; 
        border: 8px solid white; 
        border-radius: 30px; 
        overflow: hidden; 
        box-shadow: 0 10px 25px rgba(240, 98, 146, 0.3);
        background: #000;
      }
      .btn-personalizado {
        background-color: var(--rosa-oscuro);
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 50px;
        font-weight: bold;
      }
      #status { border-radius: 15px; font-weight: bold; }
    </style>
  </head>
  <body>
    
    <header class="header text-center">
        <h1 class="fw-bold">¿Perro o Gato? 🐶🐱</h1>
        <p class="mb-0">Detección Inteligente en Tiempo Real</p>
    </header>

    <main class="container">
      <div class="row">
        <div class="col-12 col-md-6 offset-md-3 text-center">
          
          <div id="status" class="alert alert-light mb-4">Iniciando sistema...</div>

          <video id="video" playsinline autoplay style="width: 1px; visibility: hidden; position: absolute;"></video>
          
          <div class="canvas-container mb-4" style="width: 400px; height: 400px; max-width: 100%;">
              <canvas id="canvas" width="400" height="400" style="width: 100%; height: 100%;"></canvas>
          </div>
          
          <button class="btn btn-personalizado btn-lg mb-3" onclick="cambiarCamara();">🔄 Girar Cámara</button>

          <canvas id="othercanvas" width="150" height="150" style="display: none"></canvas>
          
          <div id="resultado">...</div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

    <script type="text/javascript">
      var canvas = document.getElementById("canvas");
      var video = document.getElementById("video");
      var ctx = canvas.getContext("2d");
      var modelo = null;
      var currentStream = null;
      var facingMode = "user";

      // FUNCIÓN PARA CARGAR EL MODELO CON ANTICACHÉ Y PARCHE
      async function cargarModelo() {
          console.log("Cargando modelo...");
          try {
              // 1. Forzamos descarga del JSON fresco
              const response = await fetch('./model.json?v=' + Date.now());
              const modelJson = await response.json();

              // 2. PARCHE MANUAL: Si falta la forma de entrada, se la inyectamos en memoria
              if (modelJson.modelTopology && modelJson.modelTopology.model_config) {
                  let layers = modelJson.modelTopology.model_config.config.layers;
                  if (layers[0].class_name === 'InputLayer' && !layers[0].config.batch_input_shape) {
                      layers[0].config.batch_input_shape = [null, 150, 150, 3];
                      console.log("Parche batch_input_shape aplicado con éxito");
                  }
              }

              // 3. Cargamos el modelo desde el objeto modificado
              modelo = await tf.loadLayersModel(tf.io.fromMemory(
                  modelJson, 
                  modelJson.weightsManifest, 
                  window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1)
              ));

              document.getElementById("status").innerText = "¡IA Lista! ✨";
              document.getElementById("status").className = "alert alert-success text-success text-center";
              console.log("¡Modelo cargado!");
          } catch (error) {
              document.getElementById("status").innerText = "Error: El navegador bloqueó el modelo.";
              document.getElementById("status").className = "alert alert-danger text-danger text-center";
              console.error("Error detallado:", error);
          }
      }

      window.onload = function() { 
          mostrarCamara(); 
          cargarModelo();
      }

      function mostrarCamara() {
          var opciones = { audio: false, video: { facingMode: facingMode, width: 400, height: 400 } };
          navigator.mediaDevices.getUserMedia(opciones)
              .then(function(stream) {
                  currentStream = stream;
                  video.srcObject = currentStream;
                  procesarCamara();
                  predecir();
              })
              .catch(err => console.log("Cámara error:", err));
      }

      function cambiarCamara() {
          if (currentStream) { currentStream.getTracks().forEach(track => track.stop()); }
          facingMode = (facingMode == "user") ? "environment" : "user";
          mostrarCamara();
      }

      function procesarCamara() {
          ctx.drawImage(video, 0, 0, 400, 400, 0, 0, 400, 400);
          setTimeout(procesarCamara, 20);
      }

      async function predecir() {
          if (modelo != null) {
              const tempCanvas = document.getElementById("othercanvas");
              const tempCtx = tempCanvas.getContext("2d");
              tempCtx.drawImage(canvas, 0, 0, 400, 400, 0, 0, 150, 150);

              const score = tf.tidy(() => {
                  const imgData = tempCtx.getImageData(0,0,150,150);
                  const tensor = tf.browser.fromPixels(imgData)
                      .toFloat()
                      .div(tf.scalar(255.0))
                      .expandDims(0);
                  
                  return modelo.predict(tensor).dataSync()[0];
              });

              let texto = "";
              let color = "";

              if (score > 0.8) {
                  texto = "PERRO 🐶";
                  color = "#ec407a";
              } else if (score < 0.2) {
                  texto = "GATO 🐱";
                  color = "#ab47bc";
              } else {
                  texto = "Buscando... 🔎";
                  color = "#888888";
              }

              document.getElementById("resultado").innerHTML = texto;
              document.getElementById("resultado").style.color = color;
          }
          setTimeout(predecir, 250);
      }
    </script>
  </body>
</html>
