<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clasificador de Mascotas 🐾</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
      :root {
        --rosa-principal: #ff85a2;
        --rosa-oscuro: #f06292;
        --rosa-claro: #fce4ec;
      }

      body { 
        background-color: var(--rosa-claro); 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      .header {
        background: var(--rosa-principal);
        color: white;
        padding: 30px 0;
        border-bottom: 5px solid var(--rosa-oscuro);
        margin-bottom: 40px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      }

      #resultado {
        font-weight: bold;
        font-size: 3.5rem;
        text-align: center;
        margin-top: 20px;
        transition: 0.3s;
      }

      .canvas-container { 
        margin: 0 auto; 
        border: 8px solid white; 
        border-radius: 30px; 
        overflow: hidden; 
        box-shadow: 0 10px 25px rgba(240, 98, 146, 0.3);
        background: white;
      }

      .btn-personalizado {
        background-color: var(--rosa-oscuro);
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 50px;
        font-weight: bold;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      }

      .btn-personalizado:hover {
        background-color: var(--rosa-principal);
        color: white;
        transform: translateY(-2px);
      }

      #status {
        border-radius: 15px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    
    <header class="header text-center">
        <h1 class="fw-bold">¿Perro o Gato? 🐶🐱</h1>
        <p class="mb-0">Apunta con la cámara y mi IA te dirá qué mascota es</p>
    </header>

    <main class="container">
      <div class="row">
        <div class="col-12 col-md-6 offset-md-3 text-center">
          
          <div id="status" class="alert alert-light mb-4">Cargando cerebro de la IA...</div>

          <video id="video" playsinline autoplay style="width: 1px; visibility: hidden; position: absolute;"></video>
          
          <div class="canvas-container mb-4" style="width: 400px; height: 400px; max-width: 100%;">
              <canvas id="canvas" width="400" height="400" style="width: 100%; height: 100%; object-fit: cover;"></canvas>
          </div>
          
          <button class="btn btn-personalizado btn-lg mb-3" id="cambiar-camara" onclick="cambiarCamara();">
              🔄 Girar Cámara
          </button>

          <canvas id="othercanvas" width="150" height="150" style="display: none"></canvas>
          
          <div id="resultado" class="mt-3">...</div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

    <script type="text/javascript">
      var canvas = document.getElementById("canvas");
      var video = document.getElementById("video");
      var ctx = canvas.getContext("2d");
      var modelo = null;
      var size = 400;
      var currentStream = null;
      var facingMode = "user";

      // Cargar el modelo desde GitHub
      (async () => {
          console.log("Iniciando carga...");
          try {
              modelo = await tf.loadLayersModel("model.json");
              document.getElementById("status").innerText = "¡IA Lista para detectar! ✨";
              document.getElementById("status").style.color = "#f06292";
          } catch (error) {
              document.getElementById("status").innerText = "Error al conectar con el modelo";
              console.error(error);
          }
      })();

      window.onload = function() {
          mostrarCamara();
      }

      function mostrarCamara() {
          var opciones = { audio: false, video: { facingMode: facingMode, width: size, height: size } };

          if(navigator.mediaDevices.getUserMedia) {
              navigator.mediaDevices.getUserMedia(opciones)
                  .then(function(stream) {
                      currentStream = stream;
                      video.srcObject = currentStream;
                      procesarCamara();
                      predecir();
                  })
                  .catch(function(err) {
                      console.log("Error de cámara:", err);
                  })
          }
      }

      function cambiarCamara() {
          if (currentStream) {
              currentStream.getTracks().forEach(track => track.stop());
          }
          facingMode = facingMode == "user" ? "environment" : "user";
          mostrarCamara();
      }

      function procesarCamara() {
          ctx.drawImage(video, 0, 0, size, size, 0, 0, size, size);
          setTimeout(procesarCamara, 20);
      }

      async function predecir() {
          if (modelo != null) {
              // Redimensionar al tamaño que entrenaste (150x150)
              const tempCanvas = document.getElementById("othercanvas");
              const tempCtx = tempCanvas.getContext("2d");
              tempCtx.drawImage(canvas, 0, 0, 400, 400, 0, 0, 150, 150);

              // Procesar el tensor
              const imgData = tempCtx.getImageData(0,0,150,150);
              let tensor = tf.browser.fromPixels(imgData)
                  .toFloat()
                  .div(tf.scalar(255.0))
                  .expandDims();

              const prediccion = await modelo.predict(tensor).dataSync();
              const score = prediccion[0];
              
              let texto = "";
              let color = "";

              // Lógica basada en tu entrenamiento de 20 épocas
              if (score > 0.8) {
                  texto = "¡Es un Perro! 🐶";
                  color = "#ec407a"; 
              } else if (score < 0.2) {
                  texto = "¡Es un Gato! 🐱";
                  color = "#ab47bc";
              } else {
                  texto = "Buscando... 🔎";
                  color = "#888888";
              }

              document.getElementById("resultado").innerHTML = texto;
              document.getElementById("resultado").style.color = color;
          }

          setTimeout(predecir, 200);
      }
    </script>
  </body>
</html>
