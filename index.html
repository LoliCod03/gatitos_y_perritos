<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detector IA 🐾</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root { --rosa: #ff85a2; --rosa-oscuro: #f06292; }
      body { background-color: #fce4ec; font-family: sans-serif; }
      .header { background: var(--rosa); color: white; padding: 20px; border-bottom: 5px solid var(--rosa-oscuro); margin-bottom: 20px; }
      .canvas-container { margin: 0 auto; border: 8px solid white; border-radius: 30px; overflow: hidden; background: #000; width: 400px; height: 400px; max-width: 100%; }
      #resultado { font-weight: bold; font-size: 3rem; text-align: center; margin-top: 15px; }
      .btn-personalizado { background-color: var(--rosa-oscuro); color: white; border-radius: 50px; padding: 10px 30px; border: none; font-weight: bold; }
    </style>
  </head>
  <body>
    
    <header class="header text-center">
        <h1>¿Perro o Gato? 🐶🐱</h1>
    </header>

    <main class="container text-center">
      <div id="status" class="alert alert-light">Iniciando sistema...</div>

      <div class="canvas-container mb-3">
          <canvas id="canvas" width="400" height="400"></canvas>
      </div>

      <button class="btn btn-personalizado mb-3" onclick="cambiarCamara()">🔄 Cambiar Cámara</button>
      
      <div id="resultado">...</div>

      <video id="video" playsinline autoplay style="width: 1px; visibility: hidden; position: absolute;"></video>
      <canvas id="othercanvas" width="150" height="150" style="display: none"></canvas>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

    <script>
      var canvas = document.getElementById("canvas");
      var video = document.getElementById("video");
      var ctx = canvas.getContext("2d");
      var modelo = null;
      var facingMode = "user";
      var currentStream = null;

      // --- AQUÍ ESTÁ EL CAMBIO CRÍTICO ---
      async function cargarModelo() {
          console.log("Iniciando carga limpia...");
          try {
              // 1. Descargamos el JSON fresco
              const resp = await fetch('./model.json?v=' + Date.now());
              let modelJson = await resp.json();

              // 2. PARCHE MANUAL: Forzamos la propiedad que te da error
              // Buscamos la capa de entrada y le inyectamos el batch_input_shape
              if (modelJson.modelTopology && modelJson.modelTopology.model_config) {
                  let layers = modelJson.modelTopology.model_config.config.layers;
                  if (layers && layers[0]) {
                      layers[0].config.batch_input_shape = [null, 150, 150, 3];
                      console.log("Parche batch_input_shape inyectado.");
                  }
              }

              // 3. Cargamos el modelo usando el JSON que acabamos de arreglar
              // Pasamos también la ruta para que encuentre los archivos .bin
              const modelUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
              modelo = await tf.loadLayersModel(tf.io.fromMemory(
                  modelJson.modelTopology,
                  modelJson.weightsManifest,
                  modelUrl
              ));

              document.getElementById("status").innerText = "¡IA Lista! ✨";
              document.getElementById("status").className = "alert alert-success";
              console.log("¡Carga exitosa!");
          } catch (error) {
              console.error("Error detallado:", error);
              document.getElementById("status").innerText = "Error: Revisa el model.json";
              document.getElementById("status").className = "alert alert-danger";
          }
      }
      // ----------------------------------

      function mostrarCamara() {
          navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: facingMode, width: 400, height: 400 } })
              .then(function(stream) {
                  currentStream = stream;
                  video.srcObject = currentStream;
                  procesarCamara();
                  predecir();
              });
      }

      function cambiarCamara() {
          if (currentStream) { currentStream.getTracks().forEach(track => track.stop()); }
          facingMode = (facingMode == "user") ? "environment" : "user";
          mostrarCamara();
      }

      function procesarCamara() {
          ctx.drawImage(video, 0, 0, 400, 400, 0, 0, 400, 400);
          setTimeout(procesarCamara, 20);
      }

      async function predecir() {
          if (modelo != null) {
              const tempCanvas = document.getElementById("othercanvas");
              const tempCtx = tempCanvas.getContext("2d");
              tempCtx.drawImage(canvas, 0, 0, 400, 400, 0, 0, 150, 150);

              const score = tf.tidy(() => {
                  const imgData = tempCtx.getImageData(0,0,150,150);
                  const tensor = tf.browser.fromPixels(imgData).toFloat().div(tf.scalar(255.0)).expandDims(0);
                  return modelo.predict(tensor).dataSync()[0];
              });

              let texto = score > 0.5 ? "PERRO 🐶" : "GATO 🐱";
              let color = score > 0.5 ? "#ec407a" : "#ab47bc";
              if (score > 0.45 && score < 0.55) { texto = "Analizando... 🔎"; color = "#888888"; }

              document.getElementById("resultado").innerHTML = texto;
              document.getElementById("resultado").style.color = color;
          }
          setTimeout(predecir, 250);
      }

      window.onload = () => { mostrarCamara(); cargarModelo(); };
    </script>
  </body>
</html>
